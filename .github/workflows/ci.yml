name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allows manual triggering from any branch

jobs:
  fast-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Test
        run: uv run pytest tests/ -q --tb=short

  sanitizers:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        # Install with strict options, then force rebuild extensions with sanitizer flags
        run: uv sync --extra dev

      - name: Run Sanitizer (${{ matrix.sanitizer }})
        env:
          CFLAGS: "-fsanitize=${{ matrix.sanitizer }} -g -O1 -fno-omit-frame-pointer"
          CXXFLAGS: "-fsanitize=${{ matrix.sanitizer }} -g -O1 -fno-omit-frame-pointer"
          LDFLAGS: "-fsanitize=${{ matrix.sanitizer }}"
        run: |
           # Force reinstall of the project to apply CFLAGS to the C++ extension build
           uv sync --reinstall --extra dev

                     # For AddressSanitizer, we need to preload the runtime library because
                     # the Python executable itself is not built with ASan.
                     if [ "${{ matrix.sanitizer }}" = "address" ]; then
                       ASAN_LIB=$(gcc -print-file-name=libasan.so)
                       echo "Preloading ASan: $ASAN_LIB"
                       export LD_PRELOAD=$ASAN_LIB
                     fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Benchmarks
        run: uv run pytest tests/core/test_performance.py --benchmark-only

  wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

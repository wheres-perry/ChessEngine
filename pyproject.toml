[tool.poetry]
name = "chessengine"
version = "0.1.0"
description = "High-performance chess engine with ML evaluation"
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "engine", from = "src" },
    { include = "io_utils", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.1.0"
numpy = "^1.24.0"
pybind11 = "^2.11.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
mypy = "^1.7.0"
types-setuptools = "^69.0.0"
pylint = "^3.0.0"
ruff = "^0.1.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core", "pybind11", "setuptools", "wheel"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.build]
generate-setup-file = true

# MyPy Configuration
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true

exclude = [
    "tests/",
    "notebooks/",
    "search_profiler.py", 
    "unit_tests.py"
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pybind11.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "setuptools.*"
ignore_missing_imports = true

# Pylint Configuration
[tool.pylint.main]
py-version = "3.11"
source-roots = ["src"]

ignore = [
    "tests",
    "notebooks",
    "search_profiler.py",
    "unit_tests.py",
    "setup.py"
]

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "trailing-whitespace", 
    "missing-final-newline",
    "bad-indentation",
    "wrong-spelling-in-comment",
    "wrong-spelling-in-docstring",
    "wrong-import-order",
    "ungrouped-imports",
    "wrong-import-position",
    "no-member",
    "unsubscriptable-object",
    "unsupported-membership-test",
    "missing-module-docstring",
    "missing-class-docstring", 
    "missing-function-docstring",
]

enable = [
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
]

[tool.pylint.design]
max-args = 7
max-attributes = 10
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 7
max-public-methods = 25
max-returns = 8
max-statements = 60
min-public-methods = 1

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 6

[tool.pylint.variables]
allowed-redefined-builtins = ["id", "type", "input"]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "x", "y", "z", "df", "ax", "fig"]

# Ruff Configuration
[tool.ruff]
exclude = [
    "tests/",
    "notebooks/", 
    "search_profiler.py",
    "unit_tests.py"
]

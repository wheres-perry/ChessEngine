<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=./dev/bench/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moray Engine — Benchmark Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 90%;
    }
    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.8rem;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: transform 0.2s, background-color 0.2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>♟️ Moray Engine</h1>
    <p>Redirecting to the continuous benchmark dashboard...</p>
    <p><a class="btn" href="./dev/bench/">Open Benchmark Dashboard</a></p>
  </div>
</body>
</html>
